name: Update Google review count

on:
  schedule:
    - cron: "23 9 * * *"   # daily ~5:23am ET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live review count and update HTML
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "::warning::GOOGLE_PLACES_API_KEY secret is not set — skipping. Add it in repo Settings > Secrets and variables > Actions."
            exit 0
          fi
          python3 scripts/update_reviews.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "Review count unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW_COUNT=$(grep -o '[0-9]\{3,4\} reviews' index.html | head -1 | grep -o '[0-9]*')
          git add index.html reviews/index.html we-buy-sneakers-nyc/index.html
          git commit -m "Update Google review count to ${NEW_COUNT}"
          git push
