name: Update Google Shopping feeds

on:
  schedule:
    - cron: "41 */3 * * *"   # every 3 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: store-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the feeds from the live Square catalog
        run: python3 scripts/build_google_feed.py

      - name: Commit and push if changed
        run: |
          git add store/google-products.xml store/google-local-inventory.xml
          if git diff --cached --quiet; then
            echo "Stock and prices unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Google Shopping feeds from the Square catalog"
          git pull --rebase
          git push
